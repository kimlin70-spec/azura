# Azura GPS — 아이폰 IPA 자동 빌드 (서명 없음)
#
# 언제 돌아가나
#   - main 브랜치에 push        → IPA 빌드 + 아티팩트 업로드 + 릴리스 "ios-latest" 갱신, 시뮬레이터 점검
#   - claude/** 브랜치에 push   → IPA 빌드 + 아티팩트 업로드, 시뮬레이터 점검 (릴리스는 안 만듦)
#   - Actions 탭에서 수동 실행 (workflow_dispatch) → 빌드 + 아티팩트 업로드, 시뮬레이터 점검
#
# 결과물 받는 곳
#   - 릴리스:   https://github.com/kimlin70-spec/azura/releases/download/ios-latest/azura-gps.ipa
#   - 아티팩트: Actions → 해당 실행 → Artifacts → azura-gps-ipa (zip 안에 azura-gps.ipa)
#               ios-simulator-smoke (시뮬레이터 스크린샷 smoke.png, 앱 로그 smoke.log)
#
# 서명
#   유료 애플 개발자 계정이 없어서 서명하지 않은 IPA 를 만든다. 비밀(secrets)은 필요 없다.
#   설치는 사용자가 AltStore 또는 SideStore 로 한다. 무료 Apple ID 는 7일마다 갱신해야 한다.
#
# 잡 두 개 (동시에 돈다)
#   build-ipa        기기용 Release 빌드 → Payload/App.app 를 zip → dist/azura-gps.ipa → 검사 → 업로드(→ main 이면 릴리스)
#   simulator-smoke  시뮬레이터용 Debug 빌드 → 아이폰 시뮬레이터에서 실행 → 콘솔 표식 확인
#                    'AzuraNative ready ios' 가 90초 안에 없거나 JS 오류 표식이 있으면 실패.
#                    'AzuraNative first fix' 가 없으면 경고만. 릴리스는 이 잡을 기다리지 않는다.
#
# Xcode
#   Capacitor 8.6 의 SPM 바이너리(Capacitor.xcframework)는 Xcode 26(Swift 6.2)으로 만들어졌다.
#   그래서 러너에 있는 가장 새 정식 Xcode 를 고른다 (maxim-lobanov/setup-xcode, latest-stable).

name: Build iOS IPA

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write   # 릴리스 생성/갱신, ios-latest 태그 이동에 필요

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # main 은 릴리스 교체 중 끊기지 않게

defaults:
  run:
    shell: bash

env:
  IPA_NAME: azura-gps.ipa
  APP_BUNDLE_ID: io.github.kimlin70spec.azura
  XCODE_PROJECT: apk/ios/App/App.xcodeproj   # 워크스페이스 없음(SPM). 스킴 App 은 xcodebuild 가 자동 생성
  XCODE_SCHEME: App
  SPM_DIR: build/spm   # Swift 패키지(capacitor-swift-pm, ion-ios-filesystem)를 받는 곳 (저장소 기준). actions/cache 로 재사용

jobs:
  build-ipa:
    name: IPA 빌드 (서명 없음)
    runs-on: macos-15
    timeout-minutes: 60   # 보통 10분 안팎. iOS 플랫폼을 새로 받아야 하면 더 걸린다

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # 아래 ios-latest 태그 push 에 필요

      - name: Node.js 22 설치 (npm 캐시)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apk/package-lock.json

      - name: Xcode 선택 (가장 새 정식 버전)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode 정보
        run: |
          set -euo pipefail
          XV="$(xcodebuild -version)"
          printf '%s\n' "${XV}"
          echo "xcode-select: $(xcode-select -p)"
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          XCODE_LINE="$(printf '%s\n' "${XV}" | sed -n '1p')"
          XCODE_BUILD="$(printf '%s\n' "${XV}" | sed -n 's/^Build version //p')"
          XCODE_MAJOR="$(printf '%s\n' "${XCODE_LINE}" | sed -E 's/^Xcode ([0-9]+).*/\1/')"
          case "${XCODE_MAJOR}" in
            ''|*[!0-9]*) echo "::warning::Xcode 주 버전을 읽지 못했습니다: ${XCODE_LINE}" ;;
            *) if [ "${XCODE_MAJOR}" -lt 26 ]; then echo "::warning::${XCODE_LINE} 입니다. Capacitor 8.6 바이너리는 Xcode 26(Swift 6.2)으로 만들어져 빌드가 실패할 수 있습니다."; fi ;;
          esac
          echo "XCODE_INFO=${XCODE_LINE} (${XCODE_BUILD})" >> "${GITHUB_ENV}"
          echo "설치된 시뮬레이터 런타임 (참고):"
          xcrun simctl list runtimes || true

      - name: npm ci, 웹 파일 복사, Capacitor sync (iOS)
        working-directory: apk
        run: |
          set -euo pipefail
          npm ci
          node copy-web.js
          npx cap sync ios
          echo "sync 뒤 ios/ 의 git 상태 (참고용):"
          git status --short -- ios || true

      - name: 버전 계산 (실행 번호 기준)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # MARKETING_VERSION = 1.0.<실행 번호>, CURRENT_PROJECT_VERSION = 1000 + <실행 번호>
          # GitHub 표현식에는 산술이 없어서 셸에서 계산한다. 워크플로 파일 이름을 바꾸면 실행 번호가 1부터 다시 시작하니 이름을 유지할 것
          APP_VERSION="1.0.${RUN_NUMBER}"
          APP_BUILD=$((1000 + RUN_NUMBER))
          echo "APP_VERSION=${APP_VERSION}" >> "${GITHUB_ENV}"
          echo "APP_BUILD=${APP_BUILD}" >> "${GITHUB_ENV}"
          echo "버전 ${APP_VERSION} (빌드 ${APP_BUILD})"

      - name: Swift 패키지 캐시
        uses: actions/cache@v4
        with:
          path: build/spm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('apk/package-lock.json', 'apk/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Swift 패키지 받기, 프로젝트 정보 (xcodebuild -list)
        run: |
          set -euo pipefail
          # capacitor-swift-pm(Capacitor/Cordova 바이너리)과 ion-ios-filesystem 을 github.com 에서 받는다. 네트워크 오류에 대비해 3번까지
          ok=no
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project "${XCODE_PROJECT}" -clonedSourcePackagesDirPath "${GITHUB_WORKSPACE}/${SPM_DIR}"; then ok=yes; break; fi
            echo "::warning::Swift 패키지 받기 실패 (${attempt}/3). 패키지 폴더를 지우고 다시 시도합니다."
            rm -rf "${GITHUB_WORKSPACE:?}/${SPM_DIR}"
            sleep 15
          done
          if [ "${ok}" != yes ]; then
            echo "::error::Swift 패키지(capacitor-swift-pm 등)를 github.com 에서 받지 못했습니다."
            exit 1
          fi
          xcodebuild -list -project "${XCODE_PROJECT}" -clonedSourcePackagesDirPath "${GITHUB_WORKSPACE}/${SPM_DIR}" \
            || xcodebuild -list -project "${XCODE_PROJECT}" \
            || echo "::warning::xcodebuild -list 실패 (빌드는 계속 진행)"

      - name: 기기용 Release 빌드 (서명 없음)
        run: |
          set -euo pipefail
          mkdir -p build/logs
          LOG=build/logs/xcodebuild-device.log
          if command -v xcbeautify >/dev/null 2>&1; then FORMAT=xcbeautify; else FORMAT=cat; fi
          # archive 대신 build: 서명 없는 빌드에서 덜 까다롭다. 결과는 build/device/Build/Products/Release-iphoneos/App.app
          build_device() {
            xcodebuild \
              -project "${XCODE_PROJECT}" \
              -scheme "${XCODE_SCHEME}" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "${GITHUB_WORKSPACE}/build/device" \
              -clonedSourcePackagesDirPath "${GITHUB_WORKSPACE}/${SPM_DIR}" \
              MARKETING_VERSION="${APP_VERSION}" \
              CURRENT_PROJECT_VERSION="${APP_BUILD}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              build 2>&1 | tee "${LOG}" | ${FORMAT}
          }
          show_errors() {
            echo "::group::xcodebuild 오류 줄"
            grep -nE 'error:|BUILD FAILED|The following build commands failed|is not installed' "${LOG}" | sed -n '1,80p' || true
            echo "::endgroup::"
          }
          ok=no
          if build_device; then
            ok=yes
          elif grep -qE 'is not installed|download and install the platform' "${LOG}"; then
            # 고른 Xcode 의 iOS 플랫폼이 러너에 없으면 "iOS NN is not installed" 로 실패한다. 받아서 한 번 더 빌드
            show_errors
            echo "::warning::이 Xcode 의 iOS 플랫폼이 러너에 없어 xcodebuild -downloadPlatform iOS 로 받은 뒤 다시 빌드합니다 (몇 분 걸림)."
            if xcodebuild -downloadPlatform iOS && build_device; then ok=yes; fi
          fi
          if [ "${ok}" != yes ]; then
            show_errors
            echo "::error::기기용 Release 빌드가 실패했습니다. 전체 로그는 아티팩트 ios-build-log 에 있습니다."
            exit 1
          fi

      - name: IPA 만들기 (Payload/App.app → dist/azura-gps.ipa)
        run: |
          set -euo pipefail
          APP_SRC="build/device/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "${APP_SRC}" ]; then
            echo "::error::${APP_SRC} 가 없습니다."
            ls -la build/device/Build/Products || true
            exit 1
          fi
          rm -rf build/ipa dist
          mkdir -p build/ipa/Payload dist
          ditto "${APP_SRC}" build/ipa/Payload/App.app
          # IPA = Payload/ 가 최상위인 zip. -y: 심볼릭 링크는 링크로 저장
          (cd build/ipa && zip -qry "${GITHUB_WORKSPACE}/dist/${IPA_NAME}" Payload)
          ls -la dist

      - name: IPA 검사 (구조, Info.plist, arm64, 웹 파일)
        run: |
          set -euo pipefail
          IPA="dist/${IPA_NAME}"
          fail=0
          err() { echo "::error::$*"; fail=1; }

          echo "::group::unzip -l (앞부분)"
          unzip -l "${IPA}" | sed -n '1,60p'
          echo "::endgroup::"
          NAMES="$(unzip -Z1 "${IPA}")"
          OUTSIDE="$(grep -v '^Payload/' <<< "${NAMES}" || true)"
          [ -z "${OUTSIDE}" ] || err "IPA 최상위에 Payload/ 말고 다른 항목이 있습니다: $(printf '%s' "${OUTSIDE}" | tr '\n' ' ')"
          for f in Payload/App.app/Info.plist Payload/App.app/App Payload/App.app/public/index.html; do
            grep -qxF "${f}" <<< "${NAMES}" || err "IPA 안에 ${f} 가 없습니다."
          done

          # 실제 IPA 를 풀어서 그 안의 앱을 검사한다
          rm -rf build/ipa-check
          mkdir -p build/ipa-check
          unzip -q "${IPA}" -d build/ipa-check
          APP="build/ipa-check/Payload/App.app"
          PLIST="${APP}/Info.plist"
          if [ ! -f "${PLIST}" ]; then
            echo "::error::${PLIST} 가 없습니다."
            exit 1
          fi

          echo "::group::plutil -p Info.plist"
          plutil -p "${PLIST}"
          echo "::endgroup::"
          pval() { plutil -extract "$1" raw -o - "${PLIST}" 2>/dev/null || true; }
          BID="$(pval CFBundleIdentifier)"
          VER="$(pval CFBundleShortVersionString)"
          BLD="$(pval CFBundleVersion)"
          EXE="$(pval CFBundleExecutable)"
          MODES="$(plutil -extract UIBackgroundModes json -o - "${PLIST}" 2>/dev/null || true)"
          echo "CFBundleIdentifier         = ${BID}"
          echo "CFBundleShortVersionString = ${VER}"
          echo "CFBundleVersion            = ${BLD}"
          echo "CFBundleExecutable         = ${EXE}"
          echo "UIBackgroundModes          = ${MODES}"
          [ "${BID}" = "${APP_BUNDLE_ID}" ] || err "CFBundleIdentifier 가 ${APP_BUNDLE_ID} 가 아닙니다: '${BID}'"
          [ "${VER}" = "${APP_VERSION}" ] || err "CFBundleShortVersionString 이 ${APP_VERSION} 이 아닙니다: '${VER}'"
          [ "${BLD}" = "${APP_BUILD}" ] || err "CFBundleVersion 이 ${APP_BUILD} 가 아닙니다: '${BLD}'"
          case "${MODES}" in
            *'"location"'*) ;;
            *) err "UIBackgroundModes 에 location 이 없습니다. 라운드 중 백그라운드 위치가 안 되고 앱이 멈출 수 있습니다." ;;
          esac
          for k in NSLocationWhenInUseUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription; do
            [ -n "$(pval "${k}")" ] || err "Info.plist 에 ${k} 가 없습니다."
          done

          BIN="${APP}/${EXE:-App}"
          LIPO="$(lipo -info "${BIN}" 2>&1 || true)"
          echo "lipo -info: ${LIPO}"
          case "${LIPO}" in
            *arm64*) ;;
            *) err "실행 파일이 arm64 가 아닙니다: ${LIPO}" ;;
          esac

          # 웹 파일이 앱 안에 들어갔는지 (copy-web.js → www → npx cap sync ios → App/App/public)
          for f in public/index.html public/app.js public/native.js public/capacitor.js capacitor.config.json; do
            [ -f "${APP}/${f}" ] || err "앱 안에 ${f} 가 없습니다. copy-web.js 와 npx cap sync ios 를 확인하세요."
          done
          if [ -f "${APP}/public/index.html" ]; then
            grep -q 'native\.js' "${APP}/public/index.html" || err "public/index.html 에 native.js 스크립트 태그가 없습니다."
            grep -q 'capacitor\.js' "${APP}/public/index.html" || err "public/index.html 에 capacitor.js 스크립트 태그가 없습니다."
          fi
          # Capacitor/Cordova 는 SPM 동적 프레임워크라 앱 안 Frameworks/ 에 들어 있어야 실행된다
          echo "Frameworks: $(ls "${APP}/Frameworks" 2>/dev/null | tr '\n' ' ')"
          for fw in Capacitor Cordova; do
            [ -d "${APP}/Frameworks/${fw}.framework" ] || err "Frameworks/${fw}.framework 가 앱 안에 없습니다."
          done

          if [ "${fail}" != 0 ]; then exit 1; fi
          echo "IPA 검사 통과"

      - name: 요약 (크기, SHA-256, 버전, Xcode)
        run: |
          set -euo pipefail
          IPA="dist/${IPA_NAME}"
          SIZE_BYTES="$(wc -c < "${IPA}" | tr -d ' ')"
          SIZE_H="$(du -h "${IPA}" | cut -f1 | tr -d ' ')"
          SHA="$(shasum -a 256 "${IPA}" | cut -d' ' -f1)"
          echo "IPA_SHA256=${SHA}" >> "${GITHUB_ENV}"
          echo "IPA_SIZE=${SIZE_H} (${SIZE_BYTES} bytes)" >> "${GITHUB_ENV}"
          {
            echo "## Azura GPS 아이폰 IPA (서명 없음)"
            echo ""
            echo "- 파일: \`${IPA_NAME}\` (${SIZE_H}, ${SIZE_BYTES} bytes)"
            echo "- SHA-256: \`${SHA}\`"
            echo "- 버전: ${APP_VERSION} (빌드 ${APP_BUILD})"
            echo "- 번들 ID: ${APP_BUNDLE_ID}"
            echo "- Xcode: ${XCODE_INFO}"
            echo "- 커밋: ${GITHUB_SHA}"
            echo "- 설치: AltStore 또는 SideStore (무료 Apple ID 는 7일마다 갱신)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 아티팩트 업로드 (azura-gps-ipa)
        uses: actions/upload-artifact@v4
        with:
          name: azura-gps-ipa
          path: dist/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: 빌드 로그 업로드 (실패했을 때만)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7

      # ---- 아래는 main 브랜치 push 일 때만 ----

      - name: 태그 ios-latest 를 현재 커밋으로 이동
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git tag -f ios-latest "${GITHUB_SHA}"
          git push --force origin refs/tags/ios-latest

      - name: 릴리스 ios-latest 생성/갱신
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: Azura GPS 아이폰 IPA (최신, 서명 없음)
          prerelease: false
          draft: false
          make_latest: false   # 저장소의 "Latest" 표시는 안드로이드 apk-latest 가 유지
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/${{ env.IPA_NAME }}
          body: |
            아이폰용 main 브랜치 최신 빌드입니다. main 에 push 될 때마다 같은 태그(ios-latest)로 덮어써집니다.

            - 다운로드: https://github.com/${{ github.repository }}/releases/download/ios-latest/${{ env.IPA_NAME }}
            - 빌드 번호: ${{ github.run_number }} (버전 ${{ env.APP_VERSION }}, 빌드 ${{ env.APP_BUILD }})
            - 커밋: ${{ github.sha }}
            - Xcode: ${{ env.XCODE_INFO }}
            - 크기: ${{ env.IPA_SIZE }}
            - SHA-256: ${{ env.IPA_SHA256 }}
            - 빌드 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            설치 안내
            - 서명되지 않은 IPA 라서 아이폰에 바로 설치되지 않습니다. AltStore 또는 SideStore 로 설치해야 합니다.
            - 무료 Apple ID 로 설치한 앱은 7일마다 AltStore/SideStore 에서 갱신(Refresh)해야 합니다. 갱신하지 않으면 앱이 열리지 않습니다.
            - 갱신은 앱을 지우지 않고 덮어써서 기록이 남습니다. 앱을 삭제하면 기록도 지워집니다.

  simulator-smoke:
    name: 시뮬레이터 점검 (Debug)
    runs-on: macos-15
    timeout-minutes: 60   # 보통 15분 안팎. iOS 플랫폼을 새로 받아야 하면 더 걸린다
    permissions:
      contents: read   # 이 잡은 태그·릴리스를 건드리지 않는다
    env:
      SMOKE_DIR: build/smoke
      SIM_POINT_1: '-17.7135,49.5068'   # 시뮬레이터 위치 (위도,경도)
      SIM_POINT_2: '-17.7136,49.5069'   # 첫 위치가 안 오면 번갈아 옮겨 새 위치를 보낸다
      # 실패로 보는 로그 표식 (Capacitor Debug 빌드는 JS console 을 "⚡️  [level] - 메시지" 로 앱 stdout 에 찍는다)
      SMOKE_ERROR_RE: '\[error\]|JS Eval error|ERROR MESSAGE|STARTUP JS ERROR'
      # 위 표식 가운데 정상으로 보는 줄: 새로 설치한 앱의 첫 실행에서는 저장 미러 파일(DATA/azura-state.json)이 아직 없어
      # native.js 의 Filesystem.readFile 이 거절된다. Capacitor 는 거절된 호출마다 "ERROR MESSAGE:" 와 "[error]" 줄을 찍는다
      SMOKE_IGNORE_RE: 'azura-state\.json.*does not exist'

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22 설치 (npm 캐시)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apk/package-lock.json

      - name: Xcode 선택 (가장 새 정식 버전)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode 정보
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "설치된 시뮬레이터 런타임 (참고):"
          xcrun simctl list runtimes || true

      - name: npm ci, 웹 파일 복사, Capacitor sync (iOS)
        working-directory: apk
        run: |
          set -euo pipefail
          npm ci
          node copy-web.js
          npx cap sync ios

      - name: Swift 패키지 캐시 (읽기만)
        uses: actions/cache/restore@v4
        with:
          path: build/spm
          key: ios-spm-${{ runner.os }}-${{ hashFiles('apk/package-lock.json', 'apk/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Swift 패키지 받기
        run: |
          set -euo pipefail
          ok=no
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project "${XCODE_PROJECT}" -clonedSourcePackagesDirPath "${GITHUB_WORKSPACE}/${SPM_DIR}"; then ok=yes; break; fi
            echo "::warning::Swift 패키지 받기 실패 (${attempt}/3). 패키지 폴더를 지우고 다시 시도합니다."
            rm -rf "${GITHUB_WORKSPACE:?}/${SPM_DIR}"
            sleep 15
          done
          if [ "${ok}" != yes ]; then
            echo "::error::Swift 패키지(capacitor-swift-pm 등)를 github.com 에서 받지 못했습니다."
            exit 1
          fi

      - name: 시뮬레이터용 Debug 빌드
        run: |
          set -euo pipefail
          mkdir -p "${SMOKE_DIR}"
          LOG="${SMOKE_DIR}/xcodebuild-sim.log"
          if command -v xcbeautify >/dev/null 2>&1; then FORMAT=xcbeautify; else FORMAT=cat; fi
          # Debug 구성은 debug.xcconfig 의 CAPACITOR_DEBUG=true 를 쓴다 → Capacitor 가 JS console 을 앱 stdout 에 찍는다
          build_sim() {
            xcodebuild \
              -project "${XCODE_PROJECT}" \
              -scheme "${XCODE_SCHEME}" \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "${GITHUB_WORKSPACE}/build/sim" \
              -clonedSourcePackagesDirPath "${GITHUB_WORKSPACE}/${SPM_DIR}" \
              CODE_SIGNING_ALLOWED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              build 2>&1 | tee "${LOG}" | ${FORMAT}
          }
          show_errors() {
            echo "::group::xcodebuild 오류 줄"
            grep -nE 'error:|BUILD FAILED|The following build commands failed|is not installed' "${LOG}" | sed -n '1,80p' || true
            echo "::endgroup::"
          }
          ok=no
          if build_sim; then
            ok=yes
          elif grep -qE 'is not installed|download and install the platform' "${LOG}"; then
            show_errors
            echo "::warning::이 Xcode 의 iOS 플랫폼이 러너에 없어 xcodebuild -downloadPlatform iOS 로 받은 뒤 다시 빌드합니다 (몇 분 걸림)."
            if xcodebuild -downloadPlatform iOS && build_sim; then ok=yes; fi
          fi
          if [ "${ok}" != yes ]; then
            show_errors
            echo "::error::시뮬레이터용 Debug 빌드가 실패했습니다. 전체 로그는 아티팩트 ios-simulator-smoke 의 xcodebuild-sim.log"
            exit 1
          fi
          APP="build/sim/Build/Products/Debug-iphonesimulator/App.app"
          if [ ! -d "${APP}" ]; then
            echo "::error::${APP} 가 없습니다."
            exit 1
          fi
          DBG="$(plutil -extract CAPACITOR_DEBUG raw -o - "${APP}/Info.plist" 2>/dev/null || true)"
          if [ "${DBG}" != "true" ]; then
            echo "::warning::Debug 빌드의 CAPACITOR_DEBUG 가 'true' 가 아닙니다('${DBG}'). 앱 콘솔 로그가 안 나와 점검이 실패할 수 있습니다."
          fi
          echo "SIM_APP=${APP}" >> "${GITHUB_ENV}"

      - name: 아이폰 시뮬레이터 고르기, 부팅
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p "${SMOKE_DIR}"
          PICK_PY="${RUNNER_TEMP}/pick_sim.py"
          cat > "${PICK_PY}" <<'PY'
          # 사용법: pick_sim.py device devices.json   → "UDID<TAB>이름<TAB>런타임" (가장 새 iOS 런타임의 아이폰)
          #         pick_sim.py create runtimes.json  → "런타임<TAB>기기종류" 후보 (simctl create 용, 좋은 것부터)
          import json, re, sys

          def ver(s):
              nums = tuple(int(x) for x in re.findall(r"\d+", s or ""))
              return nums or (0,)

          def pref(name):
              if re.fullmatch(r"iPhone \d+", name):
                  return 3
              if re.fullmatch(r"iPhone \d+ Pro", name):
                  return 2
              if "SE" in name or "mini" in name:
                  return 0
              return 1

          mode, path = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          if mode == "device":
              best = None
              for runtime, devices in data.get("devices", {}).items():
                  m = re.search(r"SimRuntime\.iOS-([0-9-]+)$", runtime)
                  if not m:
                      continue
                  for d in devices:
                      name = d.get("name", "")
                      if not name.startswith("iPhone") or d.get("isAvailable") is False:
                          continue
                      key = (ver(m.group(1)), pref(name), name)
                      if best is None or key > best[0]:
                          best = (key, d["udid"], name, runtime)
              if best:
                  print("\t".join(best[1:]))
          else:
              cands = []
              for r in data.get("runtimes", []):
                  ident = r.get("identifier", "")
                  if r.get("platform") != "iOS" and ".SimRuntime.iOS-" not in ident:
                      continue
                  if r.get("isAvailable") is False:
                      continue
                  for t in r.get("supportedDeviceTypes", []):
                      tname = t.get("name", "")
                      if t.get("productFamily") == "iPhone" or tname.startswith("iPhone"):
                          cands.append(((ver(r.get("version")), pref(tname), tname), ident, t.get("identifier", "")))
              cands.sort(reverse=True)
              for _, ident, dtype in cands[:5]:
                  print(ident + "\t" + dtype)
          PY

          echo "::group::사용 가능한 런타임과 기기"
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available || true
          echo "::endgroup::"
          # 있는 아이폰 시뮬레이터를 고르고, 없으면 가장 새 iOS 런타임으로 하나 만든다 → PICK="UDID<TAB>이름<TAB>런타임"
          pick_or_create() {
            xcrun simctl list devices available -j > "${SMOKE_DIR}/devices.json"
            PICK="$(python3 "${PICK_PY}" device "${SMOKE_DIR}/devices.json")"
            [ -z "${PICK}" ] || return 0
            echo "::warning::사용 가능한 아이폰 시뮬레이터가 없어 새로 만듭니다."
            xcrun simctl list runtimes available -j > "${SMOKE_DIR}/runtimes.json"
            python3 "${PICK_PY}" create "${SMOKE_DIR}/runtimes.json" > "${SMOKE_DIR}/create-candidates.txt"
            while IFS=$'\t' read -r RT DT; do
              [ -n "${RT}" ] && [ -n "${DT}" ] || continue
              if NEW_UDID="$(xcrun simctl create "Azura Smoke iPhone" "${DT}" "${RT}")"; then
                PICK="${NEW_UDID}"$'\t'"Azura Smoke iPhone (${DT##*.})"$'\t'"${RT}"
                return 0
              fi
            done < "${SMOKE_DIR}/create-candidates.txt"
            return 1
          }
          PICK=""
          if ! pick_or_create; then
            echo "::warning::쓸 수 있는 iOS 시뮬레이터 런타임이 없어 xcodebuild -downloadPlatform iOS 로 받습니다 (몇 분 걸림)."
            xcodebuild -downloadPlatform iOS || true
            if ! pick_or_create; then
              echo "::error::아이폰 시뮬레이터를 찾지도 만들지도 못했습니다."
              exit 1
            fi
          fi
          SIM_UDID="$(printf '%s\n' "${PICK}" | cut -f1)"
          SIM_NAME="$(printf '%s\n' "${PICK}" | cut -f2)"
          SIM_RUNTIME="$(printf '%s\n' "${PICK}" | cut -f3)"
          echo "시뮬레이터: ${SIM_NAME} / ${SIM_RUNTIME} / ${SIM_UDID}"

          xcrun simctl boot "${SIM_UDID}" || echo "(boot 실패 또는 이미 켜져 있음. bootstatus 로 확인)"
          if ! xcrun simctl bootstatus "${SIM_UDID}" -b; then
            echo "::warning::부팅 대기 실패. 시뮬레이터를 껐다가 다시 켭니다."
            xcrun simctl shutdown "${SIM_UDID}" || true
            xcrun simctl boot "${SIM_UDID}" || true
            xcrun simctl bootstatus "${SIM_UDID}" -b
          fi
          {
            echo "SIM_UDID=${SIM_UDID}"
            echo "SIM_NAME=${SIM_NAME}"
            echo "SIM_RUNTIME=${SIM_RUNTIME}"
          } >> "${GITHUB_ENV}"

      - name: 설치, 위치 권한·위치 → 실행, 콘솔 표식 확인, 스크린샷
        timeout-minutes: 10
        run: |
          set -euo pipefail
          LOG="${SMOKE_DIR}/smoke.log"
          SHOT="${SMOKE_DIR}/smoke.png"
          LOC_ERR="${SMOKE_DIR}/simctl-location.err"
          CLEAN="${RUNNER_TEMP}/smoke.clean.log"
          LAUNCH_PID=""
          cleanup() {
            if [ -n "${LAUNCH_PID}" ]; then
              xcrun simctl terminate "${SIM_UDID}" "${APP_BUNDLE_ID}" >/dev/null 2>&1 || true
              kill "${LAUNCH_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          xcrun simctl install "${SIM_UDID}" "${SIM_APP}"

          # 위치 권한: '항상' 을 먼저, 안 되면 '앱을 사용하는 동안'
          if xcrun simctl privacy "${SIM_UDID}" grant location-always "${APP_BUNDLE_ID}"; then
            PERM=location-always
          elif xcrun simctl privacy "${SIM_UDID}" grant location "${APP_BUNDLE_ID}"; then
            PERM=location
          else
            PERM=none
            echo "::warning::simctl privacy 로 위치 권한을 주지 못했습니다. 앱이 권한 창에서 멈춰 first fix 가 안 나올 수 있습니다."
            xcrun simctl help privacy 2>&1 | sed -n '1,40p' || true
          fi

          # 시뮬레이터 위치. Xcode 마다 구문이 조금 달라 대안을 차례로 시도한다
          # (위도가 음수라 '-' 로 시작하는 인자를 옵션으로 읽는 버전에 대비해 '--' 와 표준입력 방식도 시도)
          set_location() {
            xcrun simctl location "${SIM_UDID}" set "$1" 2>>"${LOC_ERR}" && return 0
            xcrun simctl location "${SIM_UDID}" set -- "$1" 2>>"${LOC_ERR}" && return 0
            printf '%s\n%s\n' "$1" "$1" | xcrun simctl location "${SIM_UDID}" start --speed=1 - 2>>"${LOC_ERR}" && return 0
            return 1
          }
          LOC_OK=no
          if set_location "${SIM_POINT_1}"; then
            LOC_OK=yes
          else
            echo "::warning::simctl location 으로 위치를 정하지 못했습니다. first fix 가 안 나올 수 있습니다."
            cat "${LOC_ERR}" 2>/dev/null || true
            xcrun simctl help location 2>&1 | sed -n '1,40p' || true
          fi
          echo "위치 권한: ${PERM}, 위치 설정: ${LOC_OK} (${SIM_POINT_1})"

          # 앱 실행. --console-pty: 앱 stdout/stderr 를 PTY 로 받아 줄 단위로 바로 파일에 쓴다
          : > "${LOG}"
          SIMCTL_CHILD_NSUnbufferedIO=YES xcrun simctl launch --console-pty --terminate-running-process \
            "${SIM_UDID}" "${APP_BUNDLE_ID}" > "${LOG}" 2>&1 &
          LAUNCH_PID=$!

          # 최대 90초 동안 'AzuraNative ready ios' 와 'AzuraNative first fix' 를 기다린다
          READY=no; FIX=no; EXITED=no; NUDGE=0; i=0
          while [ "${i}" -lt 90 ]; do
            grep -aqF 'AzuraNative ready ios' "${LOG}" && READY=yes
            grep -aqF 'AzuraNative first fix' "${LOG}" && FIX=yes
            if [ "${READY}" = yes ] && [ "${FIX}" = yes ]; then break; fi
            if ! kill -0 "${LAUNCH_PID}" 2>/dev/null; then EXITED=yes; break; fi
            # 플러그인은 워처를 만들기 전 시각의 위치를 버린다. ready 뒤에도 첫 위치가 없으면 10초마다 위치를 조금 옮긴다
            if [ "${READY}" = yes ] && [ "${LOC_OK}" = yes ] && [ $((i % 10)) -eq 9 ]; then
              if [ $((NUDGE % 2)) -eq 0 ]; then set_location "${SIM_POINT_2}" || true; else set_location "${SIM_POINT_1}" || true; fi
              NUDGE=$((NUDGE + 1))
            fi
            sleep 1
            i=$((i + 1))
          done
          WAITED="${i}"
          sleep 5   # 표식 뒤에 늦게 찍히는 오류 줄까지 받는다
          grep -aqF 'AzuraNative ready ios' "${LOG}" && READY=yes
          grep -aqF 'AzuraNative first fix' "${LOG}" && FIX=yes
          kill -0 "${LAUNCH_PID}" 2>/dev/null || EXITED=yes

          xcrun simctl io "${SIM_UDID}" screenshot "${SHOT}" || echo "::warning::스크린샷을 찍지 못했습니다."

          # 앱 프로세스가 아직 살아 있는지 (launchd 의 UIKitApplication:<번들 ID> 항목에 PID 가 있으면 실행 중)
          RUNNING=unknown
          if LCTL="$(xcrun simctl spawn "${SIM_UDID}" launchctl list 2>/dev/null)"; then
            LINE="$(printf '%s\n' "${LCTL}" | grep -F "UIKitApplication:${APP_BUNDLE_ID}" || true)"
            case "${LINE}" in
              [0-9]*) RUNNING=yes ;;
              *) RUNNING=no ;;
            esac
          fi

          xcrun simctl terminate "${SIM_UDID}" "${APP_BUNDLE_ID}" >/dev/null 2>&1 || true
          sleep 1
          kill "${LAUNCH_PID}" 2>/dev/null || true
          wait "${LAUNCH_PID}" 2>/dev/null || true
          LAUNCH_PID=""

          LC_ALL=C tr -d '\r' < "${LOG}" > "${CLEAN}"
          STOP_TOKEN="smoke-log-$$"   # 앱 로그 안의 '::' 문자열이 워크플로 명령으로 읽히지 않게 잠시 끈다
          echo "::group::앱 로그 발췌 (AzuraNative / ⚡ / error)"
          echo "::stop-commands::${STOP_TOKEN}"
          LC_ALL=C grep -aE 'AzuraNative|⚡|[Ee]rror|ERROR' "${CLEAN}" | sed -n '1,300p' || true
          echo "::${STOP_TOKEN}::"
          echo "::endgroup::"

          ERR_LINES="$(LC_ALL=C grep -aE "${SMOKE_ERROR_RE}" "${CLEAN}" | LC_ALL=C grep -avE "${SMOKE_IGNORE_RE}" || true)"
          IGNORED_LINES="$(LC_ALL=C grep -aE "${SMOKE_ERROR_RE}" "${CLEAN}" | LC_ALL=C grep -aE "${SMOKE_IGNORE_RE}" || true)"
          count() { if [ -z "$1" ]; then echo 0; else printf '%s\n' "$1" | wc -l | tr -d ' '; fi; }
          N_ERR="$(count "${ERR_LINES}")"
          N_IGN="$(count "${IGNORED_LINES}")"
          CRASHED=no
          if [ "${EXITED}" = yes ] && [ "${RUNNING}" = no ]; then CRASHED=yes; fi

          FAIL=0
          if [ "${READY}" != yes ]; then
            echo "::error::90초 안에 'AzuraNative ready ios' 표식이 없습니다. native.js 초기화 실패, 앱 크래시, 또는 앱 로그 수집 실패입니다."
            FAIL=1
          fi
          if [ "${N_ERR}" != 0 ]; then
            echo "::error::앱 로그에 Capacitor JS 오류 표식이 ${N_ERR}줄 있습니다 (아래 출력)."
            echo "::stop-commands::${STOP_TOKEN}"
            printf '%s\n' "${ERR_LINES}" | sed -n '1,40p'
            echo "::${STOP_TOKEN}::"
            FAIL=1
          fi
          if [ "${CRASHED}" = yes ]; then
            echo "::error::점검 중에 앱 프로세스가 끝났습니다 (크래시 의심). smoke.log 와 smoke.png 를 보세요."
            FAIL=1
          elif [ "${EXITED}" = yes ]; then
            echo "::warning::simctl launch --console-pty 가 일찍 끝났습니다 (앱 실행 여부: ${RUNNING})."
          elif [ "${RUNNING}" = no ]; then
            echo "::warning::launchctl 목록에서 실행 중인 앱을 찾지 못했습니다 (실행 확인 방법이 이 Xcode 에서 다를 수 있음)."
          fi
          if [ "${FIX}" != yes ]; then
            echo "::warning::'AzuraNative first fix' 표식이 없습니다. 시뮬레이터 위치나 권한 문제일 수 있어 실패로 보지 않습니다."
          fi
          if [ "${N_IGN}" != 0 ]; then
            echo "::notice::첫 실행이라 저장 미러 파일(azura-state.json)이 없어서 생긴 오류 줄 ${N_IGN}개는 정상으로 보고 넘겼습니다."
          fi
          if [ "${FAIL}" = 0 ]; then VERDICT="통과"; else VERDICT="실패"; fi

          {
            echo "## iOS 시뮬레이터 점검: ${VERDICT}"
            echo ""
            echo "- 기기: ${SIM_NAME} (${SIM_RUNTIME##*.}), UDID ${SIM_UDID}"
            echo "- 위치 권한: ${PERM}, 위치 설정: ${LOC_OK} (${SIM_POINT_1})"
            echo "- 'AzuraNative ready ios': ${READY} / 'AzuraNative first fix': ${FIX} (대기 ${WAITED}초)"
            echo "- 오류 표식: ${N_ERR}줄 (무시한 첫 실행 저장 미러 줄: ${N_IGN})"
            echo "- 앱 실행 중(점검 끝): ${RUNNING}, 로그 수집 프로세스 조기 종료: ${EXITED}"
            echo "- 스크린샷·로그: 아티팩트 ios-simulator-smoke"
            echo ""
            echo '```'
            LC_ALL=C grep -aE 'AzuraNative|ERROR MESSAGE|JS Eval error|STARTUP JS ERROR|\[(error|warn)\]' "${CLEAN}" | sed -n '1,40p' || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${FAIL}"

      - name: 점검 결과 업로드 (ios-simulator-smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke
          path: ${{ env.SMOKE_DIR }}/
          if-no-files-found: warn
          retention-days: 14
